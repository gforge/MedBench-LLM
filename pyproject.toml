[project]
name = "medbench-llm"
version = "0.1.0"
requires-python = ">=3.12"

[dependency-groups]
main = [
    "langchain>=0.2.11,<0.4.0",
    "langchain-openai>=0.1.20,<0.4.0",
    "pandas>=2.2.2,<3.0.0",
    "openai>=1.37.1,<3.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "pydantic>=2.8.2,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "jupyter>=1.0.0,<2.0.0",
    "flake8>=7.1.0,<8.0.0",
    "pylint>=3.2.6,<4.0.0",
    "flake8-pyproject>=1.2.3,<2.0.0",
    "tiktoken>=0.7.0,<0.13.0",
    "tqdm>=4.66.5,<5.0.0",
]
dev = ["nbstripout>=0.7.1,<0.8.0"]

[tool.uv]
dev-dependencies = ["nbstripout>=0.7.1,<0.8.0"]

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pylint.'MESSAGES CONTROL']
max-line-length = 120
disable = """
   missing-module-docstring,
   broad-exception-caught
"""

[tool.flake8]
max-line-length = 120
per-file-ignores = ['__init__.py:F401']
count = true
