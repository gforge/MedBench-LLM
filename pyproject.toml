[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medbench-llm"
version = "0.1.0"
requires-python = ">=3.12"
description = "LLM tooling and evaluation utilities for MedBench."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Max Gordon", email = "max.gordon@ki.se" },
]
keywords = ["llm", "medical", "evaluation", "medbench"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "langchain>=0.2.11,<0.4.0",
    "langchain-openai>=0.1.20,<0.4.0",
    "pandas>=2.2.2,<3.0.0",
    "openai>=1.37.1,<3.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "pydantic>=2.8.2,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "jupyter>=1.0.0,<2.0.0",
    "tiktoken>=0.7.0,<0.13.0",
    "tqdm>=4.66.5,<5.0.0",
    "types-tqdm>=4.67.0.20250809",
]

[dependency-groups]
dev = [
    "black>=24.0.0,<25.0.0",
    "flake8>=7.1.0,<8.0.0",
    "mypy>=1.19.0",
    "pylint>=3.2.6,<4.0.0",
    "flake8-pyproject>=1.2.3,<2.0.0",
    "nbstripout>=0.7.1,<0.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"helpers" = ["py.typed"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pylint.'MESSAGES CONTROL']
disable = """
   missing-module-docstring,
   broad-exception-caught
"""

[tool.pylint.DESIGN]
max-line-length = 120
max-attributes = 12

[tool.flake8]
max-line-length = 120
per-file-ignores = ['__init__.py:F401']
count = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = [
    '.venv',
    '__pycache__',
    '.mypy_cache',
]
